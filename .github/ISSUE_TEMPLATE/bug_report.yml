name: Bug report
description: Report a reproducible application problem using synthetic/demo data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Security issue? Read SECURITY.md and report privately. Do not test production users or attach tokens, private photos or invitation links."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: BETA v0.1.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and browser-tab or installed-PWA mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps with local demo or synthetic data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error details or demo screenshots (optional)
